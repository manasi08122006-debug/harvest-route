            <div className="my-5 space-y-4 text-xs">
              <div className="p-4 rounded-xl bg-earth-50 border border-earth-200 space-y-2">
                <div className="flex justify-between font-bold text-forest-950 text-sm">
                  <span>Total Order Amount:</span>
                  <span>${cartTotal.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-earth-600 text-[11px]">
                  <span>Decentralized Farmer Net Pool (95%):</span>
                  <span>${netFarmerPool.toFixed(2)}</span>
                </div>
                <div className="flex justify-between text-earth-600 text-[11px]">
                  <span>Platform Redundancy Coordination Fee (5%):</span>
                  <span>${platformFee.toFixed(2)}</span>
                </div>
              </div>

              {/* Automatic Payout Splitting Breakdown */}
              {matchingPreview && (
                <div className="p-3 rounded-xl bg-forest-50 border border-forest-200 space-y-1.5">
                  <span className="font-bold text-forest-900 block text-[11px]">Automated Stripe Direct Payout Splits:</span>
                  {matchingPreview.farms.map((f, idx) => (
                    <div key={idx} className="flex justify-between text-[11px] text-earth-800">
                      <span>{f.name}</span>
                      <span className="font-mono font-semibold">${(netFarmerPool / matchingPreview.farms.length).toFixed(2)} via Connect</span>
                    </div>
                  ))}
                </div>
              )}

              {/* Card Inputs */}
              <div className="space-y-2 pt-2">
                <label className="font-bold text-earth-800 block">Test Credit Card</label>
                <div className="p-3 rounded-lg border border-earth-300 bg-earth-50 flex items-center justify-between font-mono">
                  <span>{cardNumber}</span>
                  <span className="text-[10px] font-bold text-forest-800 bg-earth-200 px-2 py-0.5 rounded">VISA TEST</span>
                </div>
                <div className="grid grid-cols-2 gap-2">
                  <input type="text" readOnly value="MM/YY: 12/28" className="p-2.5 rounded-lg border border-earth-300 bg-earth-50 font-mono text-center" />
                  <input type="text" readOnly value="CVC: 123" className="p-2.5 rounded-lg border border-earth-300 bg-earth-50 font-mono text-center" />
                </div>
              </div>

              <button 
                onClick={handlePay}
                disabled={isProcessing}
                className="w-full py-3.5 rounded-xl bg-forest-800 hover:bg-forest-900 text-white font-bold text-xs shadow-lg transition mt-4 flex items-center justify-center gap-2"
              >
                {isProcessing ? (
                  <span>Processing Test Card with Stripe...</span>
                ) : (
                  <span>Authorise & Split Payout (${cartTotal.toFixed(2)}) &rarr;</span>
                )}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
